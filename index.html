<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f3f5f8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FOIS Loaded-Rakes Desk</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f8;color:#15202c;font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;padding:20px}
.card{width:100%;max-width:380px;background:#fff;border:1px solid #e1e6ed;border-radius:18px;padding:28px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 12px 30px -18px rgba(16,24,40,.25)}
h1{font-size:19px;margin:0 0 4px}p{margin:0 0 20px;font-size:13px;color:#56657b;line-height:1.5}
label{display:block;font-size:12px;color:#56657b;margin:12px 0 5px}
input{width:100%;background:#fff;border:1px solid #cfd7e1;border-radius:11px;color:#15202c;font-size:15px;padding:12px 13px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #2e8fc4;outline-offset:2px}
button,a.btn{display:block;width:100%;margin-top:18px;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:700;background:#0e4a6b;color:#fff;cursor:pointer;text-align:center;text-decoration:none}
button:disabled{opacity:.6;cursor:default}
button.alt{background:#fff;color:#15202c;border:1px solid #cfd7e1}
#msg{min-height:18px;margin-top:14px;font-size:13px;color:#8a3b00;line-height:1.45}
.hide{display:none}
</style></head><body>
<main class="card">
  <h1 id="ttl">FOIS Loaded-Rakes Desk</h1>
  <p id="lead">Sign in to open the app.</p>
  <form id="form" class="hide">
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
  </form>
  <div id="setup" class="hide">
    <button type="button" id="pick">Choose the app file</button>
    <input id="file" type="file" accept=".html" hidden>
    <button type="button" class="alt" id="out">Sign out</button>
  </div>
  <a class="btn hide" id="back" href="./">Open the loading desk</a>
  <button type="button" class="alt hide" id="inst">Install as an app</button>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
(function(){
const SB={url:'https://kqahazjjjsvpkegeopgu.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxYWhhempqanN2cGtlZ2VvcGd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTEwNjAsImV4cCI6MjEwNjc2NzA2MH0.gERW2EK5svGYoIxTLxIhGN2WckB-VRR9eVMu088Wm9A'};
const PAGE=/[?&]run\b/.test(location.search)?{id:2,name:'Coal Rakes on Run'}:/[?&]coal\b/.test(location.search)?{id:3,name:'Daily Coal Report'}:{id:1,name:''};
const RUN=PAGE.id!==1;
const $=function(id){return document.getElementById(id);};
function show(id,v){const e=$(id); if(e) e.classList.toggle('hide',!v);}
function say(t){const e=$('msg'); if(e) e.textContent=t||'';}
function getAuth(){try{return JSON.parse(localStorage.getItem('fois_auth'));}catch(e){return null;}}
async function authCall(grant,body){
  const r=await fetch(SB.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{'apikey':SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(function(){return {};});
  if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||'Sign-in failed');e.status=r.status;throw e;}
  const old=getAuth()||{};
  localStorage.setItem('fois_auth',JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,email:(j.user&&j.user.email)||body.email||old.email||''}));
}
let refreshing=null;
async function rest(path,opt){
  opt=opt||{};
  let a=getAuth();
  if(a&&a.expires_at-Date.now()<60000){
    refreshing=refreshing||authCall('refresh_token',{refresh_token:a.refresh_token}).then(function(){refreshing=null;},function(e){refreshing=null;throw e;});
    await refreshing; a=getAuth();
  }
  const r=await fetch(SB.url+'/rest/v1/'+path,{method:opt.method||'GET',cache:'no-store',body:opt.body,
    headers:Object.assign({'apikey':SB.key,'Authorization':'Bearer '+a.access_token,'Content-Type':'application/json'},opt.headers||{})});
  if(!r.ok){const e=new Error('Request failed');e.status=r.status;throw e;}
  return opt.method?null:r.json();
}
function signOut(){try{window.caches&&caches.delete('fois-pages');}catch(e){}['fois_auth','fois_pend','fois_cloud','fois_role','fois_loadsheet_apg','fois_loadsheet_app'].forEach(function(k){localStorage.removeItem(k);});location.reload();}
let editor=false;
/* what a page written by this one may use: the signed-in session, nothing else */
window.FOIS_HOST={rest:rest,isEditor:function(){return editor;},signOut:signOut};
function writeDoc(html){document.open();document.write(html);document.close();}
/* pages are kept on the device after the first load, and fetched again only when they change */
async function cached(id){try{const c=await caches.open('fois-pages');const r=await c.match('/__page/'+id);return r?{ver:r.headers.get('x-ver'),html:await r.text()}:null;}catch(e){return null;}}
async function loadPage(id){
  const meta=await rest('fois_app?select=updated_at&id=eq.'+id);
  if(!meta.length) return null;
  const ver=meta[0].updated_at, hit=await cached(id);
  if(hit&&hit.ver===ver&&hit.html) return hit.html;
  const rows=await rest('fois_app?select=html&id=eq.'+id);
  if(!rows.length||!rows[0].html) return null;
  try{const c=await caches.open('fois-pages');await c.put('/__page/'+id,new Response(rows[0].html,{headers:{'x-ver':ver,'content-type':'text/html;charset=utf-8'}}));}catch(e){}
  return rows[0].html;
}
async function openApp(){
  show('form',false);say('Opening…');
  try{
    const ed=await rest('fois_editors?select=email'); editor=ed.length>0;
    const wantSetup=location.hash==='#update';
    const html=wantSetup?null:await loadPage(PAGE.id);
    if(html){ writeDoc(html); return; }
    if(RUN){ $('lead').textContent='This page has not been published yet. The owner publishes it by opening the loading desk once.'; show('back',true); say(''); return; }
    if(editor){$('lead').textContent='Upload the app file to publish it for everyone who signs in.';show('setup',true);say('');}
    else if(wantSetup){location.hash='';location.reload();}
    else{$('lead').textContent='This account does not have access yet. Ask the owner to add it.';show('setup',true);show('pick',false);say('');}
  }catch(e){
    if(e.status>=400&&e.status<500&&e.status!==404){localStorage.removeItem('fois_auth');show('form',true);say('Please sign in again.');}
    else{ const hit=await cached(PAGE.id); if(hit&&hit.html){ writeDoc(hit.html); return; } say('No connection. Check the internet and reload.'); }
  }
}
async function signIn(ev){
  ev.preventDefault();$('go').disabled=true;say('Signing in…');
  try{await authCall('password',{email:$('em').value.trim(),password:$('pw').value});$('pw').value='';await openApp();}
  catch(e){say(e.status?'Sign-in failed: '+e.message:'No connection. Try again when online.');}
  finally{const g=$('go'); if(g) g.disabled=false;}
}
async function publish(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  try{
    const html=await f.text();
    if(html.indexOf('FOIS Loaded-Rakes Desk')<0||html.length<200000){say('That file is not this app.');return;}
    say('Uploading…');
    await rest('fois_app?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id:1,html:html}])});
    location.hash='';location.reload();
  }catch(e){say('The app could not be uploaded'+(e.status?' ('+e.status+')':'')+'.');}
  finally{inp.value='';}
}
let installEvt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;show('inst',true);});
$('inst').addEventListener('click',async function(){if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch(x){}installEvt=null;show('inst',false);});
$('form').addEventListener('submit',signIn);
$('pick').addEventListener('click',function(){$('file').click();});
$('file').addEventListener('change',function(){publish(this);});
$('out').addEventListener('click',signOut);
if(RUN){$('ttl').textContent=PAGE.name;document.title=PAGE.name;}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(function(){});
if(getAuth()&&getAuth().refresh_token) openApp(); else show('form',true);
})();
</script></body></html>
